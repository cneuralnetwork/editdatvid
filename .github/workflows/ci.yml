name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 8080 &
          sleep 3
          curl -f http://127.0.0.1:8080/